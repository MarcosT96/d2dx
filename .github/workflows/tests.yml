name: Tests

# Windows is the authoritative build: the project is MSVC/Win32 and the tests use
# Microsoft CppUnitTest. (tests/linux/run.sh is a faster, partial local check.)

on:
  # Pushes to PR branches are covered by the pull_request run, so only run on push for main
  # (otherwise every PR commit runs twice). Branches without a PR get no CI until one is opened.
  push:
    branches: [ main ]
  pull_request:
  # Also callable from release.yml, which builds and tests the tagged commit before publishing.
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to build (default: the triggering commit)'
        type: string
        default: ''
      force:
        description: 'Skip the docs-only detection and always build'
        type: boolean
        default: false

jobs:
  # `build-and-test` is a required check on main, so the workflow must always run and report it.
  # A trigger-level `paths-ignore` would leave the check pending forever on docs-only PRs.
  # Instead this cheap job decides, and a job skipped by `if:` counts as passing for required checks.
  changes:
    # Skipped when called with force: build-and-test's condition below runs for a non-success result.
    if: ${{ !inputs.force }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          # Only the real release-please PR: its branch, opened by the bot, from this repo (not a fork).
          IS_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'github-actions[bot]' }}
        run: |
          # Anything not listed here counts as code (including this workflow and
          # tests/linux/known-failures.txt, which the test step reads).
          docs_only() {
            case "$1" in
              *.md | LICENSE.txt | toml-LICENSE.txt | screenshots/* | .github/dependabot.yml) return 0 ;;
              *) return 1 ;;
            esac
          }

          # The release PR only bumps versions and the changelog, and the release workflow rebuilds
          # and tests the tagged commit after it merges, so skip the Windows job here.
          if [ "$IS_RELEASE_PR" = true ]; then
            echo "release-please PR: skipping the build (the release job tests the tagged commit)."
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            echo "Can't tell what changed ($EVENT); running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! files=$(git diff --name-only "$range"); then
            echo "git diff failed for $range; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! docs_only "$f"; then
              echo "code change: $f"
              code=true
            fi
          done <<< "$files"

          echo "range: $range, code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    # Run when code changed, and also if the detection job itself failed (fail safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: windows-latest
    # A normal run takes ~2 minutes; a failed assert() in a Debug test can hang the headless runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: microsoft/setup-msbuild@v2

      # The projects target v142 (VS2019); the runner has VS2022, so retarget to v143.
      - name: Build unit tests
        run: msbuild src/d2dxtests/d2dxtests.vcxproj /m /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143

      # Gate the DLL build too. The post-build step copies to the author's game folder, so skip it.
      - name: Build d2dx.dll
        run: msbuild src/d2dx/d2dx.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false

      # version.h is the single source of the version (release-please rewrites it); this checks the
      # resource compiler turned it into the DLL's file properties.
      - name: Check DLL version matches version.h
        shell: pwsh
        run: |
          $h = Get-Content src/d2dx/version.h -Raw
          $parts = foreach ($p in 'MAJOR', 'MINOR', 'PATCH') { [regex]::Match($h, "#define D2DX_VERSION_$p (\d+)").Groups[1].Value }
          $expected = ($parts -join '.') + '.0'
          $info = (Get-Item src/d2dx/Release/glide3x.dll).VersionInfo
          Write-Host "FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion) expected=$expected"
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) { throw "DLL version does not match version.h" }

      # The README says no Visual C++ runtime install is needed, which holds only while the DLL is
      # statically linked (/MT). Fail if the build starts depending on a redistributable DLL.
      - name: Check DLL imports
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $deps = & $dumpbin.FullName /dependents src/d2dx/Release/glide3x.dll | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
          Write-Host "Imports: $($deps -join ', ')"
          if (-not $deps) { throw "could not read the DLL's imports" }
          $bad = $deps | Where-Object { $_ -match '^(VCRUNTIME|MSVCP|MSVCR|VCOMP|CONCRT|api-ms-win-crt|ucrtbase)' }
          if ($bad) { throw "DLL depends on the Visual C++/UCRT runtime: $($bad -join ', ')" }

      - name: Run unit tests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find '**\vstest.console.exe' | Select-Object -First 1
          $dll = Get-ChildItem -Recurse -Filter d2dxtests.dll -Path src | Select-Object -First 1
          if (-not $vstest -or -not $dll) { throw "vstest.console.exe or d2dxtests.dll not found" }

          # Same list the Linux runner uses; these fail on upstream main (see the file).
          $known = Get-Content tests/linux/known-failures.txt | ForEach-Object { ($_ -replace '#.*', '').Trim() } | Where-Object { $_ }
          $args = @($dll.FullName, '/Platform:x86', '/Logger:trx', '/Logger:console;verbosity=normal')
          if ($known) { $args += '/TestCaseFilter:' + (($known | ForEach-Object { "Name!=$_" }) -join '&') }
          & $vstest @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      # The built DLL, for manual in-game testing from a PR and for the release job to package.
      - uses: actions/upload-artifact@v4
        with:
          name: glide3x-dll
          path: |
            src/d2dx/Release/glide3x.dll
            src/d2dx/Release/glide3x.pdb
          if-no-files-found: error
          retention-days: 14
