# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ main ]
    # Docs-only changes can't affect the analysis. (Not a required check, so a trigger-level filter is safe.)
    paths-ignore: [ '**.md', 'LICENSE.txt', 'toml-LICENSE.txt', 'screenshots/**' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
    # Docs-only changes can't affect the analysis. (Not a required check, so a trigger-level filter is safe.)
    paths-ignore: [ '**.md', 'LICENSE.txt', 'toml-LICENSE.txt', 'screenshots/**' ]
  schedule:
    - cron: '44 20 * * 3'

jobs:
  analyze:
    name: Analyze
    # Windows: this is an MSVC project, and CodeQL's C++ autobuild only works there.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - uses: microsoft/setup-msbuild@v2

    # Manual build instead of autobuild: it must be a full (re)build so CodeQL sees every
    # compile. The projects target v142 (VS2019); the runner has VS2022, so retarget to v143.
    # The post-build step copies to the author's game folder, so skip it.
    - name: Build d2dx.dll
      run: msbuild src/d2dx/d2dx.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
